<section class="gold-loan section-pad-bottom" aria-labelledby="gold-loan-title">
  <div class="gold-loan__container container">
    <div class="gold-loan__card" data-anim="fade-up">
      <div class="gold-loan__content">
        <h2 class="gold-loan__title" id="gold-loan-title">Займ под залог золота</h2>
        <p class="gold-loan__text">Узнайте предварительную стоимость залога по&nbsp;фото через WhatsApp, напишите нам или оставьте заявку</p>
        <dl class="gold-loan__terms">
          <div class="gold-loan__term">
            <dt class="gold-loan__term-title">Проба</dt>
            <dd class="gold-loan__term-value">от&nbsp;375 до&nbsp;999</dd>
          </div>
          <div class="gold-loan__term">
            <dt class="gold-loan__term-title">Срок займа</dt>
            <dd class="gold-loan__term-value">от&nbsp;1 до&nbsp;30 дней</dd>
          </div>
        </dl>
        <button class="gold-loan__btn button button-accent modal-btn" type="button" data-type="feedback">Онлайн оценка</button>
      </div>
      <img class="gold-loan__img" data-anim="rise" data-anim-delay="0.2" src="img/gold-hand.png" alt="Рука с&nbsp;золотыми кольцами" width="264" height="356" loading="lazy">
    </div>

    <div class="gold-loan__prices" data-anim="fade-up" data-anim-delay="0.1">
      <div class="gold-loan__table" data-anim-stagger=".gold-loan__row">
        <div class="gold-loan__row gold-loan__row--head">
          <div class="gold-loan__cell">Проба</div>
          <div class="gold-loan__cell">Сумма</div>
        </div>
        <div class="gold-loan__row">
          <div class="gold-loan__cell">375</div>
          <div class="gold-loan__cell">до&nbsp;5120₸</div>
        </div>
        <div class="gold-loan__row">
          <div class="gold-loan__cell">500</div>
          <div class="gold-loan__cell">до&nbsp;5120₸</div>
        </div>
        <div class="gold-loan__row">
          <div class="gold-loan__cell">750</div>
          <div class="gold-loan__cell">до&nbsp;5120₸</div>
        </div>
        <div class="gold-loan__row">
          <div class="gold-loan__cell">999</div>
          <div class="gold-loan__cell">до&nbsp;5120₸</div>
        </div>
      </div>
      <p class="gold-loan__note">*Суммы указаны за&nbsp;1&nbsp;грамм и&nbsp;актуальны в&nbsp;день обращения</p>
    </div>
  </div>
</section>
