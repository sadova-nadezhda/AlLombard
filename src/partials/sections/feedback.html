<section class="feedback section-pad" id="feedback">
  <div class="feedback__container container">
    <h2 class="feedback__title">@@title</h2>
    <form class="feedback__form form">
      <input class="feedback__input" type="text" name="name" placeholder="Имя" required>
      <input class="feedback__input" type="tel" name="phone" placeholder="+7 (___) ___ ____" required>
      <button class="feedback__btn" type="submit">Отправить</button>
    </form>
  </div>
</section>
