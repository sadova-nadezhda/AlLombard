<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@@title</title>
  <meta name="description" content="@@description">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Анимации: has-anim прячет [data-anim] до старта GSAP (animations.js).
       Страховка: если скрипты не запустились за 3 с — показываем контент -->
  <script>
    (function () {
      var html = document.documentElement;
      if (!window.matchMedia("(prefers-reduced-motion: no-preference)").matches) return;
      html.classList.add("has-anim");
      setTimeout(function () {
        if (!html.classList.contains("anim-ready")) html.classList.remove("has-anim");
      }, 3000);
    })();
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
